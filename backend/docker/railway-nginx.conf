# Combined nginx + php-fpm image for Railway (api service). Same request handling as infra/nginx/default.conf,
# but fastcgi_pass points at php-fpm in the same container (127.0.0.1) instead of a separate "app" service,
# since Railway deploys one process group per service rather than compose's shared-network multi-container model.
# (server_tokens is already off in this base image's stock /etc/nginx/nginx.conf; redeclaring it here is a duplicate-directive error.)

server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    autoindex off;

    client_max_body_size 55m;
    client_header_timeout 15s;
    client_body_timeout 60s;
    send_timeout 60s;
    keepalive_timeout 30s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json text/csv text/plain application/javascript text/css;

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\. { deny all; }
}
