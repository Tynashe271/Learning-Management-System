; PHP settings for the LMS containers. Mounted by compose.yaml; if you deploy without Compose, apply the same values.
;
; The API accepts course files and submissions up to 25 MB, and a message with up to five attachments of 10 MB each.
; PHP's built-in defaults (2 MB per file, 8 MB per request) would silently reject all of that.
upload_max_filesize = 26M
post_max_size = 60M
memory_limit = 256M
max_execution_time = 60

; Never print PHP errors or warnings into an API response (they corrupt the JSON and can leak paths); log them instead.
display_errors = Off
log_errors = On

; Do not announce the PHP version in an X-Powered-By header.
expose_php = Off
