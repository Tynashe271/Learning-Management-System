; PHP-FPM worker pool for the API container. Mounted by compose.yaml as /usr/local/etc/php-fpm.d/zz-lms.conf.
;
; One screen of the web app asks for six to ten things at once (the person, notifications, messages, notices, the page's own
; lists). The image's default of five workers, starting with two, makes some of those wait while more workers start, which shows
; up as a page that hangs for several seconds. Keep a few workers ready, and allow enough to cover a busy screen plus a slow
; request (a backup check, a CSV download).
;
; Each worker uses roughly 60-80 MB, so size this to the machine: about (memory you can give the API) / 80 MB. On a small
; development VM (2 GB shared with the database, cache, storage and queue) lower these to max_children 10 and start_servers 4:
; too many workers on too little memory is worse than too few, because the machine starts swapping and every request stalls.
; These numbers suit a VM with about 8 GB. On a real server raise pm.max_children with the memory (for example 30 for 3 GB).
[www]
pm = dynamic
pm.max_children = 16
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 8
; Recycle a worker now and then so a slow leak can never grow without limit.
pm.max_requests = 500
