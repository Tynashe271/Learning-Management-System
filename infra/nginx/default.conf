# Do not advertise the nginx version in headers or error pages.
server_tokens off;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Never list a directory's contents.
    autoindex off;

    # Room for a message with five 10 MB attachments (PHP's post_max_size is 60M; see infra/php/lms.ini).
    client_max_body_size 55m;

    # Slow or stalled clients cannot hold a connection open forever.
    client_header_timeout 15s;
    client_body_timeout 60s;
    send_timeout 60s;
    keepalive_timeout 30s;

    # Compress JSON and CSV answers; they shrink to a fraction of their size. (Uploaded files are already compressed.)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json text/csv text/plain application/javascript text/css;

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        # A request that takes longer than this is answered with an error rather than left hanging.
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }

    # Nothing that starts with a dot (.env, .git, ...) is ever served.
    location ~ /\. { deny all; }
}
