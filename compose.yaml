name: university-lms
services:
  app:
    build:
      context: ./backend
      dockerfile: Containerfile
    image: localhost/lms-backend:dev
    env_file: ./backend/.env
    environment:
      LOG_STACK: single,stderr
    volumes:
      - ./backend:/var/www/html
      - vendor_data:/var/www/html/vendor
      - ./infra/php/lms.ini:/usr/local/etc/php/conf.d/zz-lms.ini:ro
      - ./infra/php/fpm.conf:/usr/local/etc/php-fpm.d/zz-lms.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [lms]
  nginx:
    image: docker.io/library/nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./backend:/var/www/html:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on: [app]
    networks: [lms]
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-lms-password}
      # Password for the least-privilege role the app connects as (see infra/postgres/app-role.sql).
      LMS_APP_DB_PASSWORD: ${LMS_APP_DB_PASSWORD:-local-lms-app-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/app-role.sql:/opt/lms/app-role.sql:ro
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      retries: 10
    networks: [lms]
  redis:
    image: docker.io/library/redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    networks: [lms]
  queue:
    image: localhost/lms-backend:dev
    command: php artisan horizon
    env_file: ./backend/.env
    environment:
      LOG_STACK: single,stderr
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q running"]
      interval: 60s
      timeout: 20s
      retries: 3
    volumes: ["./backend:/var/www/html", "vendor_data:/var/www/html/vendor", "./infra/php/lms.ini:/usr/local/etc/php/conf.d/zz-lms.ini:ro"]
    depends_on: [app]
    networks: [lms]
  scheduler:
    image: localhost/lms-backend:dev
    command: php artisan schedule:work
    env_file: ./backend/.env
    environment:
      LOG_STACK: single,stderr
    volumes: ["./backend:/var/www/html", "vendor_data:/var/www/html/vendor", "./infra/php/lms.ini:/usr/local/etc/php/conf.d/zz-lms.ini:ro"]
    depends_on: [app]
    networks: [lms]
  mailpit:
    image: docker.io/axllent/mailpit:latest
    ports: ["8025:8025"]
    networks: [lms]
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-localminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-localminio123}
    ports: ["9001:9001"]
    volumes: ["minio_data:/data"]
    networks: [lms]
  # Optional virus scanner: start it with `podman compose --profile scan up -d`, then set LMS_VIRUS_SCAN=true in
  # backend/.env. It needs about 1 GB of RAM and downloads its signature database on first start (a few minutes).
  clamav:
    image: docker.io/clamav/clamav:stable
    profiles: ["scan"]
    environment:
      CLAMD_CONF_StreamMaxLength: 30M
      CLAMD_CONF_MaxFileSize: 30M
    volumes: ["clamav_data:/var/lib/clamav"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      retries: 10
      start_period: 300s
    networks: [lms]
  minio-init:
    image: quay.io/minio/mc:latest
    entrypoint: /bin/sh
    command: -c "until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done; mc mb --ignore-existing local/lms-private"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-localminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-localminio123}
    depends_on: [minio]
    networks: [lms]
  # The web frontend (a static build served by nginx). Open http://localhost:5173. LMS_API_URL is the address the browser uses to
  # reach the API, and its origin must be one the API allows (LMS_FRONTEND_URL / LMS_CORS_ORIGINS in backend/.env).
  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    image: localhost/lms-frontend:dev
    environment:
      LMS_API_URL: ${LMS_API_URL:-http://localhost:8080/api}
    ports: ["5173:80"]
    depends_on: [nginx]
    networks: [lms]
volumes:
  vendor_data:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:
networks:
  lms:
